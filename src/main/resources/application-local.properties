spring.datasource.url=jdbc:h2:file:./build/localdb/centralton;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Local-only fallback. Production must supply RSA keys and Google/AI configuration.
centralton.dev.auth.enabled=${DEV_AUTH_ENABLED:false}
centralton.dev.auth.header-value=${DEV_AUTH_HEADER_VALUE:}
