spring.datasource.url=jdbc:h2:mem:centralton;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

centralton.jwt.issuer=centralton-api
centralton.jwt.audience=centralton-mobile
centralton.jwt.access-ttl-seconds=900
centralton.jwt.refresh-ttl-days=30
centralton.jwt.private-key=
centralton.jwt.public-key=
centralton.jwt.key-id=test-key
centralton.google.server-client-id=test-google-client-id
centralton.dev.auth.enabled=false
centralton.dev.auth.header-value=
centralton.ai.analysis-base-url=http://127.0.0.1:1
centralton.ai.recommendation-base-url=http://127.0.0.1:1
centralton.ai.analysis-connect-timeout=100ms
centralton.ai.analysis-read-timeout=100ms
centralton.ai.recommendation-connect-timeout=100ms
centralton.ai.recommendation-read-timeout=100ms
centralton.ai.base-url=http://127.0.0.1:1
centralton.ai.connect-timeout=100ms
centralton.ai.read-timeout=100ms
centralton.internal.callback-key=test-internal-callback-key
centralton.cors.allowed-origins=http://localhost:8081
