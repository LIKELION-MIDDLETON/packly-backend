spring.application.name=centralton-api
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/centralton}
spring.datasource.username=${DB_USERNAME:centralton}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

centralton.jwt.issuer=${JWT_ISSUER:centralton-api}
centralton.jwt.audience=${JWT_AUDIENCE:centralton-mobile}
centralton.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:900}
centralton.jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:30}
centralton.jwt.private-key=${JWT_PRIVATE_KEY:}
centralton.jwt.public-key=${JWT_PUBLIC_KEY:}
centralton.jwt.key-id=${JWT_KEY_ID:centralton-key}
centralton.google.server-client-id=${GOOGLE_SERVER_CLIENT_ID:}
centralton.dev.auth.enabled=${DEV_AUTH_ENABLED:false}
centralton.dev.auth.header-value=${DEV_AUTH_HEADER_VALUE:}
centralton.ai.analysis-base-url=${AI_ANALYSIS_BASE_URL:${AI_BASE_URL:http://localhost:8001}}
centralton.ai.recommendation-base-url=${AI_RECOMMENDATION_BASE_URL:${AI_BASE_URL:http://localhost:8000}}
centralton.ai.analysis-connect-timeout=${AI_ANALYSIS_CONNECT_TIMEOUT:2s}
centralton.ai.analysis-read-timeout=${AI_ANALYSIS_READ_TIMEOUT:30s}
centralton.ai.recommendation-connect-timeout=${AI_RECOMMENDATION_CONNECT_TIMEOUT:2s}
centralton.ai.recommendation-read-timeout=${AI_RECOMMENDATION_READ_TIMEOUT:10s}
# Deprecated compatibility aliases; use the two service-specific variables above.
centralton.ai.base-url=${AI_BASE_URL:http://localhost:8000}
centralton.ai.connect-timeout=${AI_CONNECT_TIMEOUT:2s}
centralton.ai.read-timeout=${AI_READ_TIMEOUT:10s}
centralton.internal.callback-key=${INTERNAL_CALLBACK_KEY:}
centralton.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
centralton.photo.storage.mode=${PHOTO_STORAGE_MODE:database}
centralton.photo.storage.region=${AWS_REGION:}
centralton.photo.storage.bucket=${S3_PHOTO_BUCKET:}
centralton.photo.storage.prefix=${S3_PHOTO_PREFIX:analysis-photos}
centralton.product-image.kakao-rest-api-key=${KAKAO_REST_API_KEY:}
centralton.product-image.kakao-base-url=${KAKAO_IMAGE_SEARCH_BASE_URL:https://dapi.kakao.com}
centralton.product-image.connect-timeout=${PRODUCT_IMAGE_CONNECT_TIMEOUT:1s}
centralton.product-image.read-timeout=${PRODUCT_IMAGE_READ_TIMEOUT:2s}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=Centralton API
info.app.version=0.0.1
